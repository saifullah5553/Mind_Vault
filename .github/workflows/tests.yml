name: Tests

# Continuous integration: run the full test suite on every push and pull request.
#
# This is what GitHub-hosted runners are genuinely good for here. The suite is
# hermetic by design (offline stub LLM, silent TTS, GIF engine, no network
# footage, no Whisper transcription, isolated storage under storage/_test), so it
# needs none of the local-only tooling that production depends on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          MIND_VAULT_LLM_PROVIDER: stub
        run: python -m pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
