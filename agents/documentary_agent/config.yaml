# Long-form Documentary Agent — configuration
# Produces a chaptered documentary of 5 to under 10 minutes (never longer). Chapters can be derived from the
# taxonomy, or supplied (e.g. from several related short videos to combine).
min_chapters: 4
max_chapters: 6
# Default documentary arc if specific chapter themes aren't supplied.
default_arc: ["Origins", "The Turning Point", "The Consequences", "The Hidden Pattern", "What It Means Today"]
target_words: [800, 1150]      # ~6–9 min at the performed ~130 wpm
