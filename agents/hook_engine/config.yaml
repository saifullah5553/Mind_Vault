# Viral Hook Engine — configuration
min_hooks: 10
weights: {curiosity: 1.3, emotion: 1.0, shock: 0.9, novelty: 1.0, clarity: 1.1}
# Signal words that raise each dimension's score (cheap, explainable heuristic).
signals:
  curiosity: [secret, hidden, why, reason, truth, nobody, what if, really, question]
  emotion: [destroyed, fear, love, betrayed, alone, powerful, fateful, lost]
  shock: [stunned, shocking, never, forever, changed everything, no one]
  novelty: [overlooked, untold, forgotten, plain sight, almost no one]
