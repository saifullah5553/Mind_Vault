# Publishing Agent — configuration
# dry_run is inherited from config/settings.yaml -> publishing.dry_run.
# Real uploads require platform credentials in .env / GitHub Secrets. Until those
# exist, every platform returns a 'dry_run' result and writes a publish manifest.
credential_env:
  youtube:   ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
  tiktok:    ["TIKTOK_ACCESS_TOKEN"]
  instagram: ["INSTAGRAM_ACCESS_TOKEN"]
  facebook:  ["FACEBOOK_PAGE_TOKEN"]
