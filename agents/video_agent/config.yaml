# Video Editing Engine — configuration
# Engine (ffmpeg/moviepy/gif) is chosen in config/settings.yaml (video.engine).

# REAL HD FOOTAGE (free, keyless, no GPU). Sources: Internet Archive
# (public-domain archival film — best for history) and Wikimedia Commons.
# Optionally add free keys for better modern b-roll:
#   PEXELS_API_KEY  / PIXABAY_API_KEY   (see docs/FOOTAGE.md)
use_stock_footage: true
footage_pool_size: 8       # clips fetched per video, cycled across scenes

# HYBRID ANIMATION: motion-graphics scenes (kinetic titles, stat counters,
# timelines, cause->effect diagrams) generated in code. Free, CPU-only, always
# on-topic, zero copyright risk. See docs/ANIMATION.md.
use_animation: true
animation_max_ratio: 0.5   # at most half the scenes animated; rest stays footage/photos

generate_images: true      # stills for any scene without footage
burn_captions: true        # captions are baked in (overlay PNG over footage)
