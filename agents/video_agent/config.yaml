# Video Editing Engine — configuration
# Engine (ffmpeg/moviepy/gif) is chosen in config/settings.yaml (video.engine).

# REAL HD FOOTAGE (free, keyless, no GPU). Sources: Internet Archive
# (public-domain archival film — best for history) and Wikimedia Commons.
# Optionally add free keys for better modern b-roll:
#   PEXELS_API_KEY  / PIXABAY_API_KEY   (see docs/FOOTAGE.md)
use_stock_footage: true
footage_pool_size: 8       # films searched per video (history: archival film)
footage_pool_size_themed: 48  # psychology: HD b-roll clips by mood (needs PIXABAY_API_KEY)
footage_shots_per_film: 4  # distinct excerpts cut from each film
footage_max_uses: 1        # each shot appears once; other scenes get HD photos

# HYBRID ANIMATION: motion-graphics scenes (kinetic titles, stat counters,
# timelines, cause->effect diagrams) generated in code. Free, CPU-only, always
# on-topic, zero copyright risk. See docs/ANIMATION.md.
use_animation: true
# Photo-led by default: HD photos (slow Ken Burns pans) and real footage carry
# most scenes; animation is kept for beats that are genuinely visual (opening
# title, chapter cards, numbers, quotes, date ranges). 1.0 + fill made every
# scene a text slide: the first 12-min documentary was 93 slides of text.
animation_max_ratio: 0.35  # 1.0 = animation-led; 0 = footage/photos only
animation_fill: false      # true = pad the ratio with generic text slides

generate_images: true      # stills for any scene without footage
burn_captions: true        # Shorts: captions baked in (they autoplay muted)
burn_captions_long: false  # long-form: clean picture, captions ship as a track
