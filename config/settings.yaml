# ═══════════════════════════════════════════════════════════════════════════
#  Mind_Vault — master configuration
#  Everything the system does is controlled from here. NO provider, threshold,
#  or path is hard-coded in the Python. Secrets are the ONLY thing not here —
#  those come from environment variables / .env (see .env.example).
# ═══════════════════════════════════════════════════════════════════════════

brand:
  name: "Mind_Vault"
  tagline: "The vault of the human mind and its history."
  language: "en"
  cta: "Follow for more stories about the human mind and history."

# ── Content strategy ────────────────────────────────────────────────────────
strategy:
  # The content mix the CEO tries to maintain across the rolling calendar.
  category_mix:
    psychology: 0.5
    history: 0.5
  calendar_days: 90
  # Avoid repeating the same emotional angle / structure back to back.
  avoid_repeat_window: 8

# ── Publishing cadence ──────────────────────────────────────────────────────
publishing:
  dry_run: true                 # true = generate metadata but DO NOT upload
  require_manual_approval: true # hold every video in the review folder until approved
  short_days: ["mon", "wed", "fri"]
  long_days: ["sun"]
  platforms: ["youtube", "tiktok", "instagram", "facebook"]
  timezone: "Asia/Dubai"
  review_dir: "storage/review"

# ── Video formats ───────────────────────────────────────────────────────────
formats:
  short:
    duration_seconds: [45, 75]
    resolution: [1080, 1920]     # vertical
    fps: 30
  long:
    duration_seconds: [480, 900] # 8–15 min
    # 2560x1440 landscape: YouTube gives 1440p a higher bitrate allocation than
    # 1080p, so the upload looks noticeably cleaner. Override per run with
    #   --orientation landscape --resolution 1080|1440|4k
    resolution: [2560, 1440]     # horizontal (16:9)
    fps: 30

# ── LLM (pluggable — swap provider without touching code) ───────────────────
llm:
  provider: "ollama"             # stub | ollama | openai | anthropic
  model: "llama3.2:3b"           # small model that fits the MX550/CPU; scales up freely
  temperature: 0.8
  max_tokens: 2048
  ollama_host_env: "OLLAMA_HOST" # which env var holds the host (default localhost)
  timeout_seconds: 180

# ── Text-to-speech (pluggable, natural-voice capable) ───────────────────────
tts:
  provider: "auto"               # auto | piper | coqui | pyttsx3 | silence
  voice: "Aria"
  gender: "female"
  words_per_minute: 155          # used to time narration when synthesizing
  # FREE natural voice: pip install piper-tts, then drop a voice .onnx into
  # storage/voices/ (e.g. en_US-amy-medium) or set the path here / $PIPER_MODEL.
  piper_model: ""
  coqui_speaker: "Ana Florence"  # a female XTTS preset (used when provider=coqui)

# ── Image generation (pluggable, free-first) ────────────────────────────────
images:
  # "stock" = REAL openly-licensed documentary photos (Wikimedia Commons /
  # Openverse), cinematically graded. This is what stops the output looking
  # like a slideshow. Falls back to a typographic card if nothing is found.
  provider: "auto"               # auto | stock | pillow | stable_diffusion
  style: "cinematic documentary, muted palette, dramatic lighting"
  width: 1080                    # match the vertical short frame
  height: 1920

# ── Video assembly ──────────────────────────────────────────────────────────
video:
  engine: "auto"                 # auto | ffmpeg | moviepy
  captions: true
  ken_burns: true                # slow zoom/pan on every still (cinematic motion)
  # Encode quality for YouTube. crf 18 + medium preset gives a high-bitrate
  # 1080p master; raise crf (e.g. 23) for faster, smaller, softer renders.
  crf: 18
  preset: "medium"
  frame_quality: 95              # JPEG quality of generated animation frames
  min_footage_height: 400        # skip stock sources too low-res to upscale
  # Captions timed from the ACTUAL narration (faster-whisper, CPU) instead of
  # estimated scene durations - more accurate, and enables short karaoke cues.
  caption_source: "auto"         # auto | audio | scenes
  caption_model: "base"          # tiny|base|small|medium (bigger = slower, better)
  caption_compute: "int8"
  # Scenes render in parallel processes. 0 = auto (CPU threads - 2, so the
  # desktop stays usable). 1 = serial, the old behaviour.
  render_workers: 0
  background_music: true         # procedural bed by default; drop royalty-free tracks in music_dir
  music_dir: "storage/music"
  music_volume: 0.18             # bed level under narration (ducks automatically)
  music_intro_outro_seconds: 4.0 # music swells a little at the intro and outro

# ── Presenter (fictional AI persona; NEVER a real person; disclosed as AI) ──
# Full persona + rendering settings live in agents/presenter_agent/config.yaml.
presenter:
  # OFF: Aria narrates (her natural Piper voice) but is NOT shown on screen.
  # A static portrait with only mouth movement reads as an obvious AI avatar and
  # cheapens the video; real footage + strong narration is far more credible.
  # Re-enable once a GPU can run SadTalker (head motion + blinking).
  enabled: false
  composite: "pip"               # pip | full | intro  (how she appears when enabled)

# ── Quality gates (a video must clear ALL of these to publish) ──────────────
quality:
  fact_score_min: 90
  originality_score_min: 85
  hook_score_min: 80
  # If Ollama fails mid-run, that call is answered by the offline stub. false =
  # such a script is rewritten (and never rendered if Ollama stays down).
  allow_llm_fallback: false
  duplicate_similarity_max: 0.80   # reject topics/scripts ≥ 80% similar
  audio_check: true
  visual_check: true
  copyright_risk_max: "low"

# ── Duplicate detection ─────────────────────────────────────────────────────
dedup:
  method: "auto"                 # auto | difflib | embeddings
  threshold: 0.80

# ── Storage ─────────────────────────────────────────────────────────────────
storage:
  root: "storage"
  videos: "storage/videos"
  audio: "storage/audio"
  images: "storage/images"
  thumbnails: "storage/thumbnails"
  backups: "storage/backups"

# ── Reliability ─────────────────────────────────────────────────────────────
reliability:
  max_retries: 3
  # Text checks (facts, originality, hook) now run BEFORE rendering. A script
  # that fails them is rewritten, or swapped for a new topic, without rendering.
  max_retopics: 2
  # Full re-renders allowed after the video exists (each is minutes at 1440p).
  max_render_retries: 1
  retry_backoff_seconds: 2
  checkpoint: true               # save partial pipeline state to resume on failure

# ── Local autopilot (python -m scripts.autopilot) ───────────────────────────
# Decides today's work from publishing.short_days / long_days and runs it on
# this machine. Publishing stays governed by the publishing: block above.
autopilot:
  research_daily: true           # refresh trends/topics/competitors every run
  review_day: "sun"              # weekly CEO report (+ learning once analytics is live)
  min_free_gb: 10                # skip rendering if the disk is nearly full
  require_real_llm: true         # never render stub scripts unattended
  require_voice: true            # never render silent narration unattended
  stale_lock_hours: 12           # older lock = crashed run, safe to take over

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  dir: "logs"
  json: false                    # true = structured JSON logs for shipping
  rotate_mb: 10
  backups: 5
